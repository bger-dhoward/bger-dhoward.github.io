<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Presentation Slide</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Slide Title</h1>
    <img src="logo.png" alt="Logo" />
  </header>

  <div class="content">
    <div class="column left-column">
      <ul>
        <li>Medium-sized bullet one</li>
        <li>Another medium point</li>
        <li>More detail goes here</li>
        <li>Important supporting info</li>
        <li>Last medium bullet</li>
      </ul>
    </div>
    <div class="column right-column">
      <ul>
        <li>Key Message One</li>
        <li>Bold Highlight Two</li>
        <li>Impactful Insight Three</li>
        <li>Major Takeaway Four</li>
        <li>Final Point Five</li>
      </ul>
    </div>
  </div>

  <footer>
    <p>Optional Footer Text</p>
    <img src="logo.png" alt="Logo" />
  </footer>
</body>
</html>
